name: Ateneo
options:
  bundleIdPrefix: it.ateneo.diario
  deploymentTarget:
    iOS: '15.0'
targets:
  Ateneo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Web]
      - path: App/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ateneo.diario.app
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ateneo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
